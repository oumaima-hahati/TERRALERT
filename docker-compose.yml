services:
  db:
    image: postgis/postgis:17-3.7
    environment:
      POSTGRES_DB: terralert
      POSTGRES_USER: terralert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terralert -d terralert"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
